name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish, for example v1.11.1
        required: true
        type: string
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi

          VERSION="${TAG#v}"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved release tag: $TAG"
          echo "Resolved version: $VERSION"

      - name: Verify release secrets are configured
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          missing=0
          for name in \
            MACOS_CERTIFICATE \
            MACOS_CERTIFICATE_PWD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_PASSWORD \
            SPARKLE_EDDSA_KEY \
            SPARKLE_PUBLIC_ED_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install and test Codex worker
        run: |
          npm --prefix worker ci --omit=dev
          npm --prefix worker test

      - name: Select Xcode 26
        run: bash "${{ github.workspace }}/scripts/select_xcode_26.sh"

      - name: Set version from tag
        run: |
          PLIST="LiveInterviewCopilot/Sources/LiveInterviewCopilot/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${RELEASE_VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${RELEASE_VERSION}" "$PLIST"
          echo "Set version to ${RELEASE_VERSION}"

      - name: Run UI smoke suite
        id: ui_smoke
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          chmod +x scripts/run_ui_smoke.sh
          ./scripts/run_ui_smoke.sh

      - name: Report advisory UI smoke failure
        if: github.event_name == 'workflow_dispatch' && steps.ui_smoke.outcome == 'failure'
        run: |
          echo "::warning::UI smoke suite failed while rebuilding a historical tag. Continuing so manual DMG backfills can still complete."

      - name: Check for signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "::error::MACOS_CERTIFICATE is required for a formal release"
            exit 1
          fi
          echo "HAS_CERT=true" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          CERT_FILE=$(mktemp /tmp/cert.XXXXXX.p12)
          KEYCHAIN_FILE="/tmp/build-$$-$(date +%s).keychain-db"
          KEYCHAIN_PWD=$(openssl rand -base64 32)

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_FILE"

          curl -sL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o /tmp/DeveloperIDG2CA.cer

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_FILE"

          security import /tmp/DeveloperIDG2CA.cer -k "$KEYCHAIN_FILE" -T /usr/bin/codesign
          security import "$CERT_FILE" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" $(security list-keychains -d user | tr -d '"')

          rm -f "$CERT_FILE" /tmp/DeveloperIDG2CA.cer

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_FILE" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::Imported certificate does not contain a Developer ID Application identity"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> "$GITHUB_ENV"

      - name: Build .app
        env:
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
          RELEASE_BUILD: "1"
          SKIP_INSTALL: "1"
          SPARKLE_FEED_URL: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/appcast.xml
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          chmod +x scripts/build_swift_app.sh
          ./scripts/build_swift_app.sh

      - name: Build DMG
        env:
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          RELEASE_BUILD: "1"
        run: |
          chmod +x scripts/make_dmg.sh
          ./scripts/make_dmg.sh

      - name: Verify signed and notarized artifacts
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Live Interview Copilot.app"
          spctl --assess --type execute --verbose=2 "dist/Live Interview Copilot.app"
          xcrun stapler validate dist/Live-Interview-Copilot.dmg

      - name: Cleanup keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_FILE:-}" ]]; then
            security delete-keychain "$KEYCHAIN_FILE" 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Live-Interview-Copilot-dmg
          path: dist/Live-Interview-Copilot.dmg

      - name: Attach DMG to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" dist/Live-Interview-Copilot.dmg --clobber

      - name: Sign DMG and update appcast
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG_PATH="dist/Live-Interview-Copilot.dmg"

          # Extract sign_update from Sparkle build artifacts
          SIGN_UPDATE=$(find LiveInterviewCopilot/.build/artifacts/sparkle -name "sign_update" -type f 2>/dev/null | head -1)
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "Error: sign_update not found in Sparkle artifacts"
            exit 1
          fi
          chmod +x "$SIGN_UPDATE"

          # Sign the DMG with EdDSA
          SIGN_OUTPUT=$(echo "$SPARKLE_EDDSA_KEY" | "$SIGN_UPDATE" "$DMG_PATH" --ed-key-file /dev/stdin)
          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
          DMG_LENGTH=$(echo "$SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')

          if [[ -z "$ED_SIGNATURE" ]]; then
            echo "Error: Failed to extract EdDSA signature"
            echo "sign_update output: $SIGN_OUTPUT"
            exit 1
          fi

          echo "EdDSA signature: $ED_SIGNATURE"
          echo "DMG length: $DMG_LENGTH"

          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Live-Interview-Copilot.dmg"
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")

          # Clone gh-pages branch
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages

          # Generate appcast.xml
          cat > /tmp/gh-pages/appcast.xml <<APPCAST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Live Interview Copilot Updates</title>
              <link>https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/appcast.xml</link>
              <description>Most recent updates to Live Interview Copilot</description>
              <language>en</language>
              <item>
                <title>Version ${RELEASE_VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${RELEASE_VERSION}</sparkle:version>
                <sparkle:shortVersionString>${RELEASE_VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <enclosure url="${DMG_URL}"
                           sparkle:edSignature="${ED_SIGNATURE}"
                           length="${DMG_LENGTH}"
                           type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          APPCAST_EOF

          # Remove leading whitespace from heredoc (macOS sed)
          sed -i '' 's/^          //' /tmp/gh-pages/appcast.xml

          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for ${RELEASE_VERSION}" || echo "No changes to commit"
          git push origin gh-pages

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA256=$(shasum -a 256 dist/Live-Interview-Copilot.dmg | awk '{print $1}')
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git clone --branch main --single-branch "$REPO_URL" /tmp/liveinterviewcopilot-main

          chmod +x /tmp/liveinterviewcopilot-main/scripts/update_homebrew_cask.sh
          /tmp/liveinterviewcopilot-main/scripts/update_homebrew_cask.sh "$RELEASE_VERSION" "$SHA256"

          cd /tmp/liveinterviewcopilot-main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/live-interview-copilot.rb
          if git diff --cached --quiet; then
            echo "No cask changes to commit"
            exit 0
          fi

          git commit -m "Update Homebrew cask for ${RELEASE_VERSION}"

          if git push origin main; then
            exit 0
          fi

          BRANCH="automation/homebrew-cask-${RELEASE_VERSION}"
          git checkout -B "$BRANCH"
          git push origin "$BRANCH" --force

          EXISTING_PR=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Open PR #$EXISTING_PR already exists for $BRANCH"
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Update Homebrew cask for ${RELEASE_VERSION}" \
            --body "Automated follow-up from the release workflow because direct pushes to protected \`main\` are blocked by branch protection." || {
              echo "::warning::Unable to create the Homebrew cask PR automatically. Branch ${BRANCH} was pushed and can be opened manually."
              exit 0
            }
